# pnpm 設定ファイル。pnpm 10.6+ / 11 は package.json の "pnpm" フィールドを読まないため、
# ビルドスクリプト許可リストはここに置く。未設定だと pnpm install が
# ERR_PNPM_IGNORED_BUILDS で失敗し、pnpm test / typecheck など全 script が動かない。
#   allowBuilds            : pnpm 11 の設定名
#   onlyBuiltDependencies  : pnpm 10 の設定名（CI が pnpm 10 の場合に有効）
allowBuilds:
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - esbuild
  - msw
  - sharp
  - unrs-resolver
